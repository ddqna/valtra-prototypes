<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A0 · Tractor screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}html,body{margin:0;height:100%;overflow:hidden;background:#0B0D0F}</style>
<script src="dc-standalone.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D0F}
a{color:#7CC4EE}a:hover{color:#B5DDF5}
.vt{font-family:'Barlow',system-ui,sans-serif;color:#F2F4F5;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.vt *{box-sizing:border-box}
.stage{background:radial-gradient(ellipse 85% 75% at 50% 40%,#2A3136 0%,#171B1E 60%,#0B0D0F 100%)}
.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:2}
.pill{height:44px;padding:0 22px;border-radius:22px;background:#F2F4F5;color:#15191C;font-weight:600;font-size:18px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.ring{width:64px;height:64px;border-radius:50%;border:2px solid #DCE2E5;background:rgba(12,14,16,.72);color:#F2F4F5;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex:none;font-family:'Barlow',sans-serif;cursor:pointer;padding:0;transition:transform .08s,border-color .15s,background .15s}
.ring:hover{border-color:#FFFFFF;background:rgba(40,46,50,.9)}
.ring:active{transform:scale(.95)}
.home{width:72px;height:72px;border-radius:50%;background:#F2F4F5;color:#15191C;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.home:hover{background:#FFFFFF;color:#15191C}
.helpbtn{display:inline-flex;align-items:center;gap:12px;height:64px;padding:0 22px 0 6px;border-radius:32px;border:2px solid #DCE2E5;background:rgba(12,14,16,.72);color:#F2F4F5;text-decoration:none;font-weight:600;font-size:18px;white-space:nowrap}
.helpbtn:hover{border-color:#FFFFFF;color:#FFFFFF}
.helpq{width:48px;height:48px;border-radius:50%;background:#F2F4F5;color:#15191C;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 30px;border-radius:30px;font-family:'Barlow',sans-serif;font-weight:600;font-size:20px;line-height:1;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:background .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.sim{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1.5px dashed #F2C230;color:#F2C230;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.muted{color:#AEB7BD}
.meta{font-size:15px;color:#AEB7BD;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.meta:hover{color:#F2F4F5}
.fn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:#C9D0D4;font-family:'Barlow',sans-serif;font-size:15px;font-weight:500;cursor:pointer}
.side{position:absolute;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;color:#C9D0D4;font-family:'Barlow',sans-serif;font-size:16px;font-weight:500;cursor:pointer}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:10px 10px 10px 26px;border-radius:34px;background:#F2F4F5;color:#15191C;font-size:18px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.55);white-space:nowrap;z-index:5}
a:focus-visible,button:focus-visible{outline:3px solid #2E9BE0;outline-offset:3px}
svg{display:block}
</style>
</helmet>
<div class="vt stage" style="width: 1280px; height: 800px">

<header class="topbar">
<div style="display: flex; align-items: center; gap: 20px; width: 380px">
<span style="font-size: 24px; font-weight: 500">08:42</span>
<a class="meta" href="index.html">Prototype menu</a>
</div>
<div style="display: flex; align-items: center; gap: 12px"><span class="pill">Field 3 · Cultivator</span><span class="sim">Simulated</span></div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px; width: 380px">
<a class="helpbtn" href="A1-Explore.html"><span class="helpq" aria-hidden="true">?</span>Help &amp; learn</a>
<a class="home" href="A0-Home.html" aria-label="Home: tractor screen"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg></a>
</div>
</header>

<!-- Left column: generic system functions (not part of this prototype) -->
<button class="side" style="left: 40px; top: 150px" onClick="{{ tap.display }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>Display</button>
<button class="side" style="left: 40px; top: 250px" onClick="{{ tap.log }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>Work log</button>
<button class="side" style="left: 40px; top: 350px" onClick="{{ tap.guidance }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 18-7-4-7 4z"/></svg></span>Guidance</button>
<button class="side" style="left: 40px; top: 450px" onClick="{{ tap.implement }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M6 6v9l-2 4M12 6v9l-2 4M18 6v9l-2 4"/></svg></span>Implement</button>

<!-- Right column -->
<button class="side" style="right: 40px; top: 150px; flex-direction: row-reverse" onClick="{{ tap.isobus }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0zM12 18v3"/></svg></span>Implement control</button>
<button class="side" style="right: 40px; top: 250px; flex-direction: row-reverse" onClick="{{ tap.memory }}"><span class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>Favourites</button>

<!-- Tractor (generic line drawing, not a Valtra model) -->
<div style="position: absolute; left: 390px; top: 190px; width: 500px">
<svg width="500" height="310" viewBox="0 0 420 260" fill="none" stroke="#DCE2E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Generic tractor outline">
<path d="M20 238h380" stroke="#3A444A"/>
<path d="M36 170v-42q0-12 12-12h132v40"/>
<path d="M150 116l22-82h108l26 82"/>
<path d="M184 46h86l18 62H170z" stroke="#8A949B"/>
<path d="M160 116V72" />
<path d="M206 158q84-84 168 0"/>
<circle cx="290" cy="178" r="60"/><circle cx="290" cy="178" r="26" stroke="#8A949B"/>
<circle cx="92" cy="198" r="40"/><circle cx="92" cy="198" r="15" stroke="#8A949B"/>
</svg>
</div>

<!-- Function shortcuts around the tractor -->
<button class="fn" style="left: 470px; top: 150px" onClick="{{ tap.lights }}"><span class="ring" style="border-color: #E8C547"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"/></svg></span>Lights</button>
<button class="fn" style="left: 740px; top: 140px" onClick="{{ tap.headland }}"><span class="ring" style="border-color: #F28C28"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V10a5 5 0 0 1 10 0v11"/><path d="M14 18l3 3 3-3"/></svg></span>Headland</button>
<button class="fn" style="left: 400px; top: 470px" onClick="{{ tap.hitch }}"><span class="ring" style="border-color: #2E9BE0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M8 19V9l4-4 4 4v10"/><circle cx="12" cy="12" r="2"/></svg></span>Hitch</button>
<button class="fn" style="left: 540px; top: 520px" onClick="{{ tap.pto }}"><span class="ring" style="border-color: #4CC35E"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 3v3M12 18v3"/></svg></span>PTO</button>
<button class="fn" style="left: 830px; top: 450px" onClick="{{ tap.hydraulics }}"><span class="ring" style="border-color: #F28C28"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v8H9zM12 11v10M8 21h8"/></svg></span>Hydraulics</button>

<!-- Status strip (simulated) -->
<div style="position: absolute; left: 40px; bottom: 32px; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 22px; border-radius: 32px; background: rgba(12,14,16,.72); border: 1px solid #3A444A; font-size: 17px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #4CC35E"></span>
<span>Stationary · Ready for task</span>
<span class="muted">Implement: Cultivator</span>
<span class="sim">Simulated</span>
</div>

<button class="ring" style="position: absolute; right: 40px; bottom: 28px; width: 104px; height: 104px; border-width: 0; background: rgba(12,14,16,.85)" aria-label="Drive view" onClick="{{ tap.drive }}"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="15" r="5"/><path d="M4 14v-4h6l1-5h5l1 5"/></svg></button>

<sc-if value="{{ showToast }}" hint-placeholder-val="{{ false }}">
<div class="toast" role="status"><span>“{{ toast }}” isn't part of this prototype.</span><button class="btn" style="min-height: 48px; padding: 0 22px; font-size: 18px; background: #15191C; color: #F2F4F5" onClick="{{ closeToast }}">OK</button></div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: null }; }
  renderVals() {
    const say = (name) => () => this.setState({ toast: name });
    return {
      tap: {
        display: say('Display'), log: say('Work log'), guidance: say('Guidance'),
        implement: say('Implement'), isobus: say('Implement control'), memory: say('Favourites'),
        lights: say('Lights'), headland: say('Headland'), hitch: say('Hitch'),
        pto: say('PTO'), hydraulics: say('Hydraulics'), drive: say('Drive view')
      },
      showToast: !!this.state.toast,
      toast: this.state.toast || '',
      closeToast: () => this.setState({ toast: null })
    };
  }
}
</script>
</body>
</html>
